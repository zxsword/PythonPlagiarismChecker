# 非敏感配置模板（可安全提交到版本控制）
# 使用方法：将此文件复制并重命名为 config.yaml
#
# ⚠️  API Key 和代理地址等敏感字段已移至 .env 文件管理
#     请参考 .env.example 进行配置

# --- AI 模型设置 ---
api_base: ''
api_model: 'gemini-1.5-flash'
local_model: 'qwen2.5-3b-instruct-q4_k_m.gguf'

# 云端 API 两次请求之间的最小间隔（秒）。Gemini 免费档建议 5.0；
# DeepSeek/小米 mimo 等高并发账号可改成 0.2~0.5 加速批改。
api_min_interval: 5.0

# --- 作业/习题要求 ---
exercise_text: ''

# --- 查重与批改 UI 状态（程序关闭时自动保存，下次启动恢复） ---
threshold: 85.0           # 相似度阈值（%）
advanced_mode: false      # 深度查重模式（无视变量重命名）
enable_plag: true         # 是否启用抄袭检测
enable_grading: false     # 是否启用自动批改
grading_method: 'AST 静态质量打分'
require_suggestions: true # 是否要求 AI 给出修改建议
selected_files: []        # 上次加载的文件列表（启动时自动恢复）
